[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway-fastapi"
version = "0.1.0"
description = "A FastAPI gateway that puts OpenAI, Anthropic, Gemini and Groq behind one API with fallback, caching, rate limiting and cost tracking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jamshaid Basit" }]
keywords = ["llm", "gateway", "fastapi", "openai", "anthropic", "gemini", "groq", "caching"]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.5",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
redis = ["redis>=5"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
